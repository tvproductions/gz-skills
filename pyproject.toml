[project]
name = "govzero-skills"
version = "0.3.0"
description = "Portable GovZero agent skills and their pinned installer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "GovZero" }
]
dependencies = []

[project.scripts]
gz-skills = "gz_skills.cli:main"

[project.urls]
Repository = "https://github.com/tvproductions/gz-skills"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.opencode/.gitignore",
    "/.opencode/node_modules",
    "/.opencode/package-lock.json",
    "/.opencode/package.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gz_skills"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "gz_skills/bundled"
