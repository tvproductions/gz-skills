[project]
name = "govzero-skills"
version = "0.12.0"
description = "Portable GovZero agent skills and their pinned installer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "GovZero" }
]
dependencies = []

[project.scripts]
gz-skills = "gz_skills.cli:main"

[project.urls]
Repository = "https://github.com/tvproductions/gz-skills"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gz_skills"
source-include = [
    "tests/**", "scripts/**", "schemas/**", "docs/**", "adapters/**",
    ".agents/plugins/**", ".codex-plugin/**", ".claude-plugin/**",
    "package.json", "index.js", "CHANGELOG.md", "AGENTS.md", "uv.lock",
    ".python-version",
]
source-exclude = [
    "/.opencode/.gitignore",
    "/.opencode/node_modules",
    "/.opencode/package-lock.json",
    "/.opencode/package.json",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    ".venv",
    "node_modules",
]
data = { purelib = "skills" }

[tool.uv]
required-version = ">=0.13.5"
python-preference = "only-managed"

[tool.ruff]
target-version = "py314"

# Portable helper compatibility is distinct from this publisher's CLI runtime.
[tool.ruff.per-file-target-version]
"skills/**/*.py" = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.14"

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "skills-ref==0.1.1",
    "ty==0.0.104",
]
