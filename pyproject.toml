[project]
name = "govzero-skills"
version = "0.10.0"
description = "Portable GovZero agent skills and their pinned installer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "GovZero" }
]
dependencies = []

[project.scripts]
gz-skills = "gz_skills.cli:main"

[project.urls]
Repository = "https://github.com/tvproductions/gz-skills"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.opencode/.gitignore",
    "/.opencode/node_modules",
    "/.opencode/package-lock.json",
    "/.opencode/package.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gz_skills"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "gz_skills/bundled"

[tool.uv]
required-version = ">=0.13.5"
python-preference = "only-managed"

[tool.ruff]
target-version = "py314"

# Portable helper compatibility is distinct from this publisher's CLI runtime.
[tool.ruff.per-file-target-version]
"skills/**/*.py" = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.14"
