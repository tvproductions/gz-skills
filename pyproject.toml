[project]
name = "govzero-skills"
version = "0.1.0"
description = "Portable GovZero agent skills and their pinned installer"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "GovZero" }
]
dependencies = []

[project.scripts]
gz-skills = "gz_skills.cli:main"

[project.urls]
Repository = "https://github.com/tvproductions/gz-skills"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gz_skills"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "gz_skills/bundled"
